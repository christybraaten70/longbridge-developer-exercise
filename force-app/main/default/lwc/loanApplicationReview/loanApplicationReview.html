<template>
    <lightning-card>
<!-- Summary Metrics & Filter Bar -->
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="slds-grid slds-wrap slds-gutters slds-grid_vertical-align-end">                
                <!-- Status Filter -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                    <lightning-combobox
                        name="statusFilter"
                        label="Status"
                        value={selectedStatus}
                        placeholder="Select Status"
                        options={statusOptions}
                        onchange={handleStatusChange}
                        class="slds-m-right_small">
                    </lightning-combobox>
                </div>

                <!-- Summary Count -->
                <div class="slds-col slds-size_1-of-2 slds-medium-size_4-of-12">
                    <div class="slds-box slds-box_x-small slds-theme_shade slds-text-align_center">
                        <p class="slds-text-title_caps slds-text-color_weak">Total Applications</p>
                        <p class="slds-text-heading_medium slds-font-weight_bold">{summaryCount}</p>
                    </div>
                </div>

                <!-- Summary Amount -->
                <div class="slds-col slds-size_1-of-2 slds-medium-size_4-of-12">
                    <div class="slds-box slds-box_x-small slds-theme_shade slds-text-align_center">
                        <p class="slds-text-title_caps slds-text-color_weak">Total Loan Amount</p>
                        <p class="slds-text-heading_medium slds-font-weight_bold">
                            <lightning-formatted-number 
                                value={summaryTotal} 
                                format-style="currency" 
                                currency-code="USD"
                                minimum-fraction-digits="0" 
                                maximum-fraction-digits="0">>
                            </lightning-formatted-number>
                        </p>
                    </div>
                </div>                
            </div>
        </div>
        <div class="slds-var-m-around_medium">
            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
            </template>

            <!-- Data Table -->
            <template if:true={applications}>
                <lightning-datatable
                    key-field="Id"
                    data={applications}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>
            <!-- Empty State -->
            <template if:true={isEmpty}>
                <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                    No loan applications found.
                </div>
            </template>        
        </div>

        <!-- Approval / Rejection Decision Reason Modal -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="bare-inverse" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                    </header>
                    
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-textarea
                            name="comments"
                            label="Decision Reason"
                            value={decisionReason}
                            placeholder="Enter the reason for your decision..."
                            required={isCommentRequired}
                            onchange={handleCommentChange}>
                        </lightning-textarea>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant={confirmButtonVariant} label={confirmButtonLabel} onclick={handleConfirmAction} disabled={isLoading}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
